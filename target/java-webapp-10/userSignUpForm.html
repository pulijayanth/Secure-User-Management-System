<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="usersignUp.css">
</head>
<body>

<div class="container">

    <div class="left">

        <h1>Create Account</h1>

        <p>
            Register a new user by entering the required details.
        </p>

        <ul>
            <li>✔ Secure Registration</li>
            <li>✔ Easy User Management</li>
            <li>✔ Fast Authentication</li>
        </ul>

    </div>

    <div class="right">

        <h2>User Registration</h2>

        <form action="signUp.jsp" method="post">

            <div class="input-box">
                <label>First Name</label>
                <input type="text" name="fname" required>
            </div>

            <div class="input-box">
                <label>Last Name</label>
                <input type="text" name="lname" required>
            </div>

            <div class="input-box">
                <label>Username</label>
                <input type="text" name="uname" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="lpass" required>
            </div>

            <button type="submit">
                Sign Up
            </button>

        </form>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
