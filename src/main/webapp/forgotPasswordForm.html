<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="forgotPasswordForm.css">
</head>
<body>

<div class="container">

    <!-- Left Panel -->

    <div class="left">

        <h1>Password Recovery</h1>

        <p>
            Reset your account password securely by entering your username and choosing a new password.
        </p>

        <ul>
            <li>✔ Secure Password Reset</li>
            <li>✔ Quick Recovery Process</li>
            <li>✔ Protect Your Account</li>
        </ul>

    </div>

    <!-- Right Panel -->

    <div class="right">

        <h2>Reset Password</h2>

        <form action="updateNewPassword.jsp" method="post">

            <div class="input-box">

                <label>Username</label>

                <input
                        type="text"
                        name="uname"
                        placeholder="Enter your username"
                        required>

            </div>

            <div class="input-box">

                <label>New Password</label>

                <input
                        type="password"
                        name="newpass"
                        placeholder="Enter your new password"
                        required>

            </div>

            <button type="submit">
                Reset Password
            </button>

        </form>

        <a href="index.html" class="back-btn">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
